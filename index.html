<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PuriChem Endress Instrumentation — Available Stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#bce2f5;
    --panel:#171E22;
    --row-alt:#1B2327;
    --border:#2A3438;
    --text:#00080a;
    --muted:#8FA0A6;
    --accent:#C17A3E;
    --accent-hover:#D68C4E;
    --ok:#5B9279;
    --ok-bg:rgba(91,146,121,0.12);
    --low:#C1953E;
    --low-bg:rgba(193,149,62,0.12);
    --out:#A8574B;
    --out-bg:rgba(168,87,75,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px;margin:0 auto;padding:0 20px 80px;}

  header{
    padding:48px 0 28px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:16px;
  }
  .brand-mark{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .brand-mark svg{flex-shrink:0;}
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:1.7rem;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .tagline{
    color:var(--muted);
    font-size:0.92rem;
    margin:0;
  }
  .status-line{
    text-align:right;
    font-size:0.8rem;
    color:var(--muted);
    font-family:'IBM Plex Mono',monospace;
  }
  .status-line .dot{
    display:inline-block;
    width:6px;height:6px;
    border-radius:50%;
    background:var(--ok);
    margin-right:6px;
    box-shadow:0 0 0 3px var(--ok-bg);
  }

  .controls{
    margin:28px 0 8px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    align-items:center;
  }
  .search-field{
    flex:1;
    min-width:220px;
    position:relative;
  }
  .search-field input{
    width:100%;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    padding:11px 14px;
    border-radius:6px;
    font-size:0.95rem;
    font-family:'Inter',sans-serif;
  }
  .search-field input:focus{
    outline:none;
    border-color:var(--accent);
  }
  .search-field input::placeholder{color:var(--muted);}
  .count-pill{
    font-size:0.8rem;
    color:var(--muted);
    font-family:'IBM Plex Mono',monospace;
    white-space:nowrap;
  }

  table.catalog{
    width:100%;
    border-collapse:collapse;
    margin-top:12px;
  }
  .col-head{
    font-size:0.75rem;
    color:var(--muted);
    text-align:left;
    font-weight:500;
    padding:10px 12px;
    border-bottom:1px solid var(--border);
  }
  .col-head.num, td.num{text-align:center;}
  .col-head.action, td.action{text-align:right;}

  tbody tr{
    border-bottom:1px solid var(--border);
    transition:background 0.15s ease;
  }
  tbody tr:hover{background:var(--row-alt);}
  td{padding:14px 12px;vertical-align:middle;}
  .pn{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.85rem;
    color:var(--text);
  }
  .pn.empty{color:var(--muted);}
  .desc{font-size:0.93rem;}
  a.product-link{
    color:inherit;
    text-decoration:none;
    border-bottom:1px solid var(--border);
    transition:border-color 0.15s ease, color 0.15s ease;
  }
  a.product-link:hover{
    color:var(--accent);
    border-bottom-color:var(--accent);
  }
  .brand-tag{
    font-size:0.72rem;
    color:var(--muted);
    display:block;
    margin-top:2px;
  }
  .qty-badge{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.78rem;
    padding:3px 9px;
    border-radius:20px;
  }
  .qty-badge.ok{color:var(--ok);background:var(--ok-bg);}
  .qty-badge.low{color:var(--low);background:var(--low-bg);}
  .qty-badge.out{color:var(--out);background:var(--out-bg);}

  button.reserve-btn{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:0.85rem;
    background:transparent;
    color:var(--accent);
    border:1px solid var(--accent);
    padding:7px 14px;
    border-radius:6px;
    cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease;
  }
  button.reserve-btn:hover{background:var(--accent);color:#12181B;}
  button.reserve-btn:disabled{
    color:var(--muted);
    border-color:var(--border);
    cursor:not-allowed;
    background:transparent;
  }

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
  }

  /* Modal */
  .overlay{
    position:fixed;inset:0;
    background:rgba(8,11,13,0.72);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    max-width:420px;
    width:100%;
    padding:28px;
  }
  .modal h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:1.2rem;
    margin:0 0 4px;
  }
  .modal .modal-item{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.82rem;
    color:var(--accent);
    margin-bottom:20px;
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:0.82rem;
    color:var(--muted);
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    background:var(--bg);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 12px;
    border-radius:6px;
    font-size:0.95rem;
    font-family:'Inter',sans-serif;
  }
  .field input:focus{outline:none;border-color:var(--accent);}
  .field-error{
    font-size:0.78rem;
    color:var(--out);
    margin-top:5px;
    display:none;
  }
  .modal-actions{
    display:flex;
    gap:10px;
    margin-top:22px;
  }
  .modal-actions button{
    flex:1;
    padding:11px;
    border-radius:6px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:0.9rem;
    cursor:pointer;
    border:1px solid var(--border);
  }
  .btn-cancel{background:transparent;color:var(--muted);}
  .btn-submit{background:var(--accent);color:#12181B;border-color:var(--accent);}
  .btn-submit:hover{background:var(--accent-hover);}
  .btn-submit:disabled{opacity:0.6;cursor:wait;}

  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ok);
    color:#0d1411;
    padding:13px 22px;
    border-radius:8px;
    font-weight:600;
    font-size:0.9rem;
    opacity:0;
    transition:opacity 0.25s ease, transform 0.25s ease;
    pointer-events:none;
    z-index:60;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* Mobile: collapse table to stacked rows */
  @media (max-width:640px){
    .col-head{display:none;}
    table, tbody, tr, td{display:block;width:100%;}
    tbody tr{padding:14px 4px;border-bottom:1px solid var(--border);}
    td{padding:2px 4px;}
    td.num, td.action{text-align:left;}
    td.action{margin-top:10px;}
    td.desc-cell{margin-bottom:8px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand-mark">
      <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
        <circle cx="17" cy="17" r="15.5" stroke="#C17A3E" stroke-width="1.5"/>
        <circle cx="17" cy="17" r="2.5" fill="#C17A3E"/>
        <line x1="17" y1="4" x2="17" y2="8" stroke="#C17A3E" stroke-width="1.5"/>
        <line x1="17" y1="26" x2="17" y2="30" stroke="#8FA0A6" stroke-width="1.5"/>
        <line x1="4" y1="17" x2="8" y2="17" stroke="#8FA0A6" stroke-width="1.5"/>
        <line x1="26" y1="17" x2="30" y2="17" stroke="#8FA0A6" stroke-width="1.5"/>
        <line x1="17" y1="17" x2="23" y2="11" stroke="#E9EFF1" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <div>
        <h1>PuriChem Endress Instrumentation</h1>
        <p class="tagline">Instrumentation stock available for direct purchase</p>
      </div>
    </div>
    <div class="status-line" id="status-line"><span class="dot"></span>Loading…</div>
  </header>

  <div class="controls">
    <div class="search-field">
      <input type="text" id="search" placeholder="Search by part number or description…">
    </div>
    <div class="count-pill" id="count-pill"></div>
  </div>

  <table class="catalog" id="catalog-table">
    <thead>
      <tr>
        <th class="col-head">Part number</th>
        <th class="col-head">Description</th>
        <th class="col-head num">In stock</th>
        <th class="col-head action"></th>
      </tr>
    </thead>
    <tbody id="catalog-body"></tbody>
  </table>

  <div class="empty-state" id="empty-state" style="display:none;"></div>

</div>

<!-- Reservation modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2>Reserve this item</h2>
    <div class="modal-item" id="modal-item-label"></div>
    <form id="reserve-form">
      <div class="field">
        <label for="res-email">Email address</label>
        <input type="email" id="res-email" required placeholder="you@company.com">
        <div class="field-error" id="email-error">Enter a valid email address.</div>
      </div>
      <div class="field">
        <label for="res-mobile">Mobile number</label>
        <input type="tel" id="res-mobile" required placeholder="+20 10 000 0000">
        <div class="field-error" id="mobile-error">Enter a valid mobile number.</div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="cancel-btn">Cancel</button>
        <button type="submit" class="btn-submit" id="submit-btn">Reserve</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   CONFIG — fill these in after you finish the setup steps.
   ========================================================= */
const CONFIG = {
  SHEET_ID: '12heLdRnHIVxhIdEVx5EZTIsSzNC-A1F7SVBe66YLL2E',
  SHEET_TAB: 'Stock',
  APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbzGydmYob5rC9KRY0LCX1mZPp9N_QUxW105m0WRd3gwVZGT8uw-S4_TSkFidNojHnMB/exec',
  REFRESH_SECONDS: 30
};

const csvUrl = () =>
  `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(CONFIG.SHEET_TAB)}&cachebust=${Date.now()}`;

let items = [];
let currentItem = null;

function parseCsv(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"' && text[i+1] === '"'){ field += '"'; i++; }
      else if (c === '"'){ inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"'){ inQuotes = true; }
      else if (c === ','){ row.push(field); field=''; }
      else if (c === '\n' || c === '\r'){
        if (field !== '' || row.length){ row.push(field); rows.push(row); row = []; field=''; }
        if (c === '\r' && text[i+1] === '\n') i++;
      } else { field += c; }
    }
  }
  if (field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows;
}

async function loadStock(){
  const statusEl = document.getElementById('status-line');
  try {
    const res = await fetch(csvUrl());
    if (!res.ok) throw new Error('fetch failed');
    const text = await res.text();
    const rows = parseCsv(text).filter(r => r.length > 1);
    rows.shift(); // header row
    items = rows.map(r => ({
      pn: (r[0] || '').trim(),
      brand: (r[1] || '').trim(),
      description: (r[2] || '').trim(),
      qty: parseInt(r[3], 10) || 0
    })).filter(it => it.description);

    const now = new Date();
    statusEl.innerHTML = `<span class="dot"></span>Live — updated ${now.toLocaleTimeString()}`;
    render();
  } catch (err){
    statusEl.innerHTML = `<span class="dot" style="background:#A8574B;box-shadow:0 0 0 3px rgba(168,87,75,0.15);"></span>Could not load live stock`;
    document.getElementById('empty-state').style.display = 'block';
    document.getElementById('empty-state').textContent =
      CONFIG.SHEET_ID.includes('PASTE')
        ? 'Storefront isn\u2019t connected yet — add your Sheet ID in the CONFIG section of this page.'
        : 'Couldn\u2019t reach the stock sheet. Check that it\u2019s shared as "Anyone with the link — Viewer".';
  }
}

function qtyBadge(qty){
  if (qty <= 0) return `<span class="qty-badge out">Out of stock</span>`;
  if (qty <= 3) return `<span class="qty-badge low">Limited stock</span>`;
  return `<span class="qty-badge ok">In stock</span>`;
}

function endressSearchUrl(it){
  const query = encodeURIComponent(`site:endress.com ${it.pn} ${it.description}`.trim());
  return `https://www.google.com/search?q=${query}`;
}

function render(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const filtered = items.filter(it =>
    it.pn.toLowerCase().includes(q) || it.description.toLowerCase().includes(q)
  );
  const body = document.getElementById('catalog-body');
  const emptyState = document.getElementById('empty-state');
  document.getElementById('count-pill').textContent = `${filtered.length} of ${items.length} items`;

  if (!filtered.length){
    body.innerHTML = '';
    emptyState.style.display = 'block';
    emptyState.textContent = items.length ? 'No parts match your search.' : 'No stock loaded.';
    return;
  }
  emptyState.style.display = 'none';

  body.innerHTML = filtered.map((it, idx) => {
    const link = endressSearchUrl(it);
    return `
    <tr>
      <td class="pn ${it.pn ? '' : 'empty'}">${it.pn ? `<a class="product-link" href="${link}" target="_blank" rel="noopener">${it.pn}</a>` : '—'}</td>
      <td class="desc desc-cell"><a class="product-link" href="${link}" target="_blank" rel="noopener">${escapeHtml(it.description)}</a><span class="brand-tag">${escapeHtml(it.brand)}</span></td>
      <td class="num">${qtyBadge(it.qty)}</td>
      <td class="action">
        <button class="reserve-btn" data-idx="${items.indexOf(it)}" ${it.qty <= 0 ? 'disabled' : ''}>
          ${it.qty <= 0 ? 'Unavailable' : 'Reserve'}
        </button>
      </td>
    </tr>
  `;
  }).join('');

  body.querySelectorAll('.reserve-btn').forEach(btn => {
    btn.addEventListener('click', () => openModal(items[parseInt(btn.dataset.idx, 10)]));
  });
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function openModal(item){
  currentItem = item;
  document.getElementById('modal-item-label').textContent = `${item.pn || 'No PN'} — ${item.description}`;
  document.getElementById('res-email').value = '';
  document.getElementById('res-mobile').value = '';
  document.getElementById('email-error').style.display = 'none';
  document.getElementById('mobile-error').style.display = 'none';
  document.getElementById('overlay').classList.add('open');
}
function closeModal(){
  document.getElementById('overlay').classList.remove('open');
  currentItem = null;
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3200);
}

document.getElementById('cancel-btn').addEventListener('click', closeModal);
document.getElementById('overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeModal(); });
document.getElementById('search').addEventListener('input', render);

document.getElementById('reserve-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('res-email').value.trim();
  const mobile = document.getElementById('res-mobile').value.trim();
  const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  const mobileOk = /^[0-9+()\-\s]{6,}$/.test(mobile);
  document.getElementById('email-error').style.display = emailOk ? 'none' : 'block';
  document.getElementById('mobile-error').style.display = mobileOk ? 'none' : 'block';
  if (!emailOk || !mobileOk) return;

  const submitBtn = document.getElementById('submit-btn');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Sending…';

  try {
    await fetch(CONFIG.APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        pn: currentItem.pn,
        description: currentItem.description,
        email, mobile
      })
    });
    // no-cors gives an opaque response, so we treat the send as successful.
    currentItem.qty = Math.max(currentItem.qty - 1, 0);
    closeModal();
    render();
    showToast('Reserved — we\u2019ll contact you shortly.');
  } catch (err){
    showToast('Something went wrong. Please try again.');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Reserve';
  }
});

loadStock();
setInterval(loadStock, CONFIG.REFRESH_SECONDS * 1000);
</script>
</body>
</html>
